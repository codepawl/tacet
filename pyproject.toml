[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tacet"
version = "0.2.1"
description = "Typed decisions (choice, score, yes/no) with a probability for every option, from one encoder pass"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "CodePawl", email = "hello@codepawl.com" }]
keywords = ["tacet", "typed decisions", "classification", "calibration", "encoder", "mmbert"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.6",
    "transformers>=5.17",
    "safetensors>=0.5",
    "huggingface_hub>=1.0",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
benchmark = ["pyarrow>=17"]

[project.scripts]
tacet = "tacet.cli:main"

[project.urls]
Homepage = "https://codepawl.com"
Models = "https://huggingface.co/codepawl"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/tacet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads a real checkpoint (set TACET_TEST_CHECKPOINT to its folder)"]
